<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="OpenCode-style web search provider">
  <title>OpenCode-style web search provider</title>
  <defs>
    <linearGradient id="lens" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#2f6bdc"/>
    </linearGradient>
  </defs>
  <!-- globe: the web being searched -->
  <circle cx="14" cy="14" r="9.25" fill="none" stroke="url(#lens)" stroke-width="2"/>
  <path d="M4.75 14h18.5M14 4.75c2.6 2.6 3.9 5.7 3.9 9.25S16.6 20.65 14 23.25C11.4 20.65 10.1 17.55 10.1 14S11.4 7.35 14 4.75z" fill="none" stroke="url(#lens)" stroke-width="1.5" opacity="0.75"/>
  <!-- handle: the search -->
  <path d="M20.6 20.6 27.5 27.5" fill="none" stroke="url(#lens)" stroke-width="3.2" stroke-linecap="round"/>
  <!-- node links: the MCP endpoints opencode calls -->
  <circle cx="24.5" cy="7.5" r="2.6" fill="none" stroke="#8f6adf" stroke-width="1.8"/>
  <path d="M21.4 5.4 18.1 7.9" fill="none" stroke="#8f6adf" stroke-width="1.6" stroke-linecap="round"/>
</svg>
